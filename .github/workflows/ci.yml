name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Install build tooling
        run: python -m pip install build

      - name: Run tests including installed-wheel conformance
        run: python -m pytest -q

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Regression suite
        run: aipf regress

      - name: Golden baseline check
        run: aipf baseline-check regression/baselines/golden_baselines.json

  portability-py310:
    name: Portability smoke / Python 3.10 / ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and build tooling
        run: |
          pip install -e ".[dev]"
          python -m pip install build

      - name: Inventory and wheel/sdist conformance smoke
        run: python -m pytest -q tests/test_package_portability.py -k "inventory or wheel_archive or wheel_from_sdist or clean_wheel"
